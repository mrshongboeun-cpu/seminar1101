<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>답지 관리</title>
<!--
  📖 답지 관리 — 교재 유닛마다 답지(PDF·사진)를 1개씩 올립니다.
  학생은 학생앱에서 **자기 지금 진도 유닛**의 답지만, **학원 와이파이에서만** 열 수 있습니다.
  학원 와이파이 등록 = Vercel 환경변수 ACADEMY_IPS (이 화면 맨 위에 넣을 값이 나옵니다)
  뒷단: api/answers.js · 판정: lib/wifi.js · 파일 보관: lib/storage.js
-->
<style>
  :root { --line:#e5e2da; --ink:#1f2328; --muted:#6b7280; --green:#1f7a70; --bg:#faf9f6; --warn:#b4472e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); background:#fff; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  h1 { margin:0; font-size:19px; } nav a { font-size:13px; color:var(--muted); text-decoration:none; margin-left:12px; }
  main { max-width:820px; margin:0 auto; padding:20px 16px; }
  button { padding:7px 12px; border:1px solid var(--green); background:var(--green); color:#fff; border-radius:8px; cursor:pointer; font-size:13px; font-family:inherit; white-space:nowrap; }
  button.ghost { background:#fff; color:var(--green); }
  button.del { background:#fff; color:var(--warn); border-color:#e6c9bf; }
  button:disabled { opacity:.5; cursor:default; }
  .muted { color:var(--muted); font-size:13px; }
  .box { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; line-height:1.65; font-size:14px; }
  .box.ok { background:#eef7f2; border-color:#cfe6da; }
  .box.warn { background:#fff6f3; border-color:#f0d6cc; }
  code { background:#f1f4f3; padding:2px 7px; border-radius:5px; font-size:13px; word-break:break-all; }
  select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:15px; font-family:inherit; background:#fff; }
  .row { display:flex; align-items:center; gap:10px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:10px; margin-top:8px; }
  .row .t { flex:1; min-width:0; }
  .row .c { font-weight:800; font-size:14px; }
  .row .n { font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .f { font-size:12px; color:var(--green); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .btns { display:flex; gap:6px; flex-shrink:0; }
  .row.has { border-color:#cfe6da; }
  .sum { margin:14px 0 4px; font-size:13px; color:var(--muted); }
  @media (max-width:520px){ .row{ flex-wrap:wrap; } .row .btns{ width:100%; } .row .btns button{ flex:1; } }
</style>
<script src="/config.js"></script>
</head>
<body>
<header>
  <h1><span data-academy></span> 📖 답지 관리</h1>
  <nav><a href="/">🏠 홈</a><a href="/books.html">📚 교재 · 목차</a></nav>
</header>
<main>
  <!-- 학원 와이파이 상태 -->
  <div class="box" id="wifi">와이파이 확인 중…</div>

  <div class="box">
    교재를 고르고, 유닛마다 <b>답지(PDF 또는 사진)</b>를 올리세요. 다시 올리면 바뀝니다.<br>
    <span class="muted">학생은 학생앱 「내 진도」 에서 <b>지금 진도 유닛의 답지만</b>, <b>학원 와이파이에서만</b> 열 수 있어요.
    올리기는 어디서든 됩니다.</span>
  </div>

  <select id="book"><option value="">교재를 고르세요</option></select>
  <div class="sum" id="sum"></div>
  <div id="list"></div>
  <input type="file" id="file" accept="application/pdf,image/jpeg,image/png,image/webp,image/heic" hidden>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
async function api(body) {
  const r = await fetch("/api/answers", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "실패했어요");
  return d;
}

// ── 학원 와이파이 상태 ──
async function loadWifi() {
  try {
    const d = await api({ action:"wifi" });
    const box = $("#wifi");
    if (d.on_wifi) {
      box.className = "box ok";
      box.innerHTML = `📶 <b>지금 학원 와이파이예요</b> — 답지가 열립니다. <span class="muted">(이 기기 IP <code>${esc(d.ip)}</code>)</span>`;
    } else if (!d.registered) {
      box.className = "box warn";
      box.innerHTML = `📶 <b>학원 와이파이가 아직 등록되지 않았어요</b> — 지금은 아무 데서도 답지가 안 열립니다.<br>
        <b>학원에서 와이파이에 연결한 채로</b> 이 화면을 열면 아래에 학원 IP 가 나옵니다.<br>
        지금 이 기기 IP: <code>${esc(d.ip || "알 수 없음")}</code><br>
        → Vercel → Settings → Environment Variables 에 <code>ACADEMY_IPS</code> = 위 값 을 넣고 <b>Redeploy</b>.`;
    } else {
      box.className = "box warn";
      box.innerHTML = `📶 <b>지금은 학원 와이파이가 아니에요</b> — 이 기기에서는 답지가 안 열립니다 (올리기는 됩니다).<br>
        <span class="muted">이 기기 IP <code>${esc(d.ip || "알 수 없음")}</code> · 학원에 있는데도 이렇게 나오면 휴대폰 데이터를 끄거나,
        학원 인터넷 IP 가 바뀐 것이니 <code>ACADEMY_IPS</code> 를 이 값으로 고치고 Redeploy 하세요.</span>`;
    }
  } catch (e) { $("#wifi").textContent = "와이파이 확인 실패: " + e.message; }
}

// ── 교재 목록 ──
async function loadBooks() {
  const r = await fetch("/api/attendance?action=textbooks"); const d = await r.json();
  const sel = $("#book");
  for (const t of (d.textbooks || [])) {
    const o = document.createElement("option");
    o.value = t.id; o.textContent = `${t.name}${t.subject ? " · " + t.subject : ""} (${(t.units||[]).length}유닛)`;
    sel.appendChild(o);
  }
  try { const last = localStorage.getItem("answers.book"); if (last && [...sel.options].some(o => o.value === last)) sel.value = last; } catch {}
  if (sel.value) loadList();
}
$("#book").addEventListener("change", () => { try { localStorage.setItem("answers.book", $("#book").value); } catch {} loadList(); });

// ── 유닛별 답지 ──
let UNITS = [];
async function loadList() {
  const id = $("#book").value;
  $("#list").innerHTML = ""; $("#sum").textContent = "";
  if (!id) return;
  try {
    const d = await api({ action:"list", textbook_id:id });
    UNITS = d.units;
    const n = UNITS.filter(u => u.answer).length;
    $("#sum").textContent = UNITS.length ? `답지 ${n} / ${UNITS.length} 유닛` : "";
    $("#list").innerHTML = UNITS.length ? UNITS.map((u, i) => `
      <div class="row${u.answer ? " has" : ""}">
        <div class="t"><div class="c">${esc(u.code)}</div><div class="n">${esc(u.title)}</div>
          ${u.answer ? `<div class="f">📎 ${esc(u.answer.file_name || "답지")}</div>` : ""}</div>
        <div class="btns">
          ${u.answer ? `<button class="ghost" onclick="view(${i})">보기</button>` : ""}
          <button${u.answer ? ' class="ghost"' : ""} onclick="pick(${i})" id="up-${i}">${u.answer ? "바꾸기" : "⬆ 올리기"}</button>
          ${u.answer ? `<button class="del" onclick="del(${i})">지우기</button>` : ""}
        </div>
      </div>`).join("") : `<p class="muted">이 교재는 목차가 비어 있어요. <a href="/books.html">교재 · 목차</a>에서 먼저 넣어주세요.</p>`;
  } catch (e) { $("#list").innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}

// ── 올리기: 서버에서 일회용 주소 받기 → 브라우저가 Supabase 로 직접 올리기 → 기록 ──
let PICK = -1;
function pick(i) { PICK = i; $("#file").value = ""; $("#file").click(); }
$("#file").addEventListener("change", async () => {
  const f = $("#file").files[0], u = UNITS[PICK];
  if (!f || !u) return;
  if (f.size > 50 * 1024 * 1024) { alert("50MB 보다 큰 파일은 올릴 수 없어요."); return; }
  const btn = $("#up-" + PICK); btn.disabled = true; btn.textContent = "올리는 중…";
  const textbook_id = $("#book").value;
  try {
    const type = f.type || (/\.pdf$/i.test(f.name) ? "application/pdf" : "");
    const s = await api({ action:"upload-url", textbook_id, unit_code:u.code, file_name:f.name, content_type:type });
    const r = await fetch(s.url, { method:"PUT", headers:{ "Content-Type":type, "x-upsert":"true" }, body:f });
    if (!r.ok) throw new Error("파일 올리기 실패 (" + r.status + ") " + (await r.text()).slice(0, 150));
    await api({ action:"confirm", textbook_id, unit_code:u.code, path:s.path, file_name:f.name, content_type:type });
    await loadList();
  } catch (e) { alert(e.message); btn.disabled = false; btn.textContent = "다시 올리기"; }
});

// ── 보기 (학원 와이파이에서만) ──
async function view(i) {
  const w = window.open("", "_blank");
  try {
    const d = await api({ action:"view", textbook_id:$("#book").value, unit_code:UNITS[i].code });
    if (w) w.location.href = d.url; else location.href = d.url;
  } catch (e) { if (w) w.close(); alert(e.message); }
}

// ── 지우기 ──
async function del(i) {
  const u = UNITS[i];
  if (!confirm(`${u.code} 답지를 지울까요?`)) return;
  try { await api({ action:"delete", textbook_id:$("#book").value, unit_code:u.code }); loadList(); }
  catch (e) { alert(e.message); }
}

loadWifi(); loadBooks();
</script>
</body>
</html>
